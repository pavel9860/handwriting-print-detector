[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hwdet"
version = "1.0.1"
description = "Handwriting vs print text-line detector for document pages in 90 languages (YOLO26): training, evaluation, inference, model registry"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "pavel9860" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Development Status :: 4 - Beta",
]
dependencies = ["numpy>=2.0", "opencv-python-headless>=4.9", "pyyaml>=6.0"]

[project.optional-dependencies]
infer = ["ultralytics>=8.4.175,<8.5"]
train = ["ultralytics>=8.4.175,<8.5", "mlflow>=2.15"]
data = [
    "pymupdf>=1.24,<1.28",
    "hwsynth @ git+https://github.com/pavel9860/realistic_handwriting_153_scripts@v0.2.1",
    "ds-page-generation[pagegen,multilang,hand] @ git+https://github.com/pavel9860/ds-page-generation@v0.2.1",
]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pre-commit>=3.7"]

[project.urls]
Repository = "https://github.com/pavel9860/handwriting-print-detector"
Issues = "https://github.com/pavel9860/handwriting-print-detector/issues"

[project.scripts]
hwdet = "hwdet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow' -p no:cacheprovider"
markers = ["slow: needs weights or a GPU-sized run, run with pytest -m slow"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E731", "E402", "E501", "E701", "E702", "E741", "B905", "B007", "UP031"]
